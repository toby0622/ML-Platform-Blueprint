name: ml-platform-blueprint

services:
  postgres:
    image: postgres:16.9-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mlflow}
      POSTGRES_USER: ${POSTGRES_USER:-mlflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mlflow-local-only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mlflow} -d ${POSTGRES_DB:-mlflow}"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [metadata]
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-mlplatform}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-mlplatform-local-only}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks: [artifacts]
    restart: unless-stopped

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "local/$${MLFLOW_S3_BUCKET}"
        mc anonymous set none "local/$${MLFLOW_S3_BUCKET}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-mlplatform}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-mlplatform-local-only}
      MLFLOW_S3_BUCKET: ${MLFLOW_S3_BUCKET:-mlflow-artifacts}
    networks: [artifacts]
    restart: "no"

  mlflow:
    build:
      context: .
      dockerfile: infra/images/mlflow/Dockerfile
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      - --backend-store-uri=postgresql+psycopg2://${POSTGRES_USER:-mlflow}:${POSTGRES_PASSWORD:-mlflow-local-only}@postgres:5432/${POSTGRES_DB:-mlflow}
      - --artifacts-destination=s3://${MLFLOW_S3_BUCKET:-mlflow-artifacts}
      - --serve-artifacts
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-mlplatform}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-mlplatform-local-only}
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_DEFAULT_REGION: us-east-1
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 20
    ports:
      - "5000:5000"
    networks: [metadata, artifacts]
    restart: unless-stopped

  platform-api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ML_PLATFORM_STATE_DIR: /var/lib/ml-platform
      ML_PLATFORM_TENANTS: ${ML_PLATFORM_TENANTS:-team-a,team-b}
      ML_PLATFORM_CODE_REVISION: ${ML_PLATFORM_CODE_REVISION:-compose}
      ML_PLATFORM_ENVIRONMENT: compose
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_EXPERIMENT_NAME: ml-platform-blueprint
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_SERVICE_NAME: ml-platform-control-plane
    depends_on:
      mlflow:
        condition: service_healthy
      otel-collector:
        condition: service_started
    ports:
      - "8080:8080"
    volumes:
      - platform-state:/var/lib/ml-platform
    networks: [control, metadata]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  otel-collector:
    image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.157.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    environment:
      MLFLOW_OTLP_ENDPOINT: http://mlflow:5000
    depends_on:
      mlflow:
        condition: service_healthy
    volumes:
      - ./observability/opentelemetry/collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    networks: [control, metadata]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.4.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks: [control, observability]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.0.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: local-only-change-me
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus]
    ports:
      - "3000:3000"
    networks: [observability]
    restart: unless-stopped

networks:
  control:
    internal: true
  metadata:
    internal: true
  artifacts:
    internal: true
  observability: {}

volumes:
  postgres-data:
  minio-data:
  platform-state:
  prometheus-data:
  grafana-data:
