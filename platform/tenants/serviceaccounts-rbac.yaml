apiVersion: v1
kind: ServiceAccount
metadata:
  name: ml-developer
  namespace: team-a
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: model-serving
  namespace: team-a
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ml-developer
  namespace: team-a
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, services, configmaps, persistentvolumeclaims]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [serving.kserve.io]
    resources: [inferenceservices]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [kueue.x-k8s.io]
    resources: [localqueues, workloads]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ml-developer
  namespace: team-a
subjects:
  - kind: Group
    name: ml-platform:team-a
    apiGroup: rbac.authorization.k8s.io
  - kind: ServiceAccount
    name: ml-developer
    namespace: team-a
roleRef:
  kind: Role
  name: ml-developer
  apiGroup: rbac.authorization.k8s.io
---
