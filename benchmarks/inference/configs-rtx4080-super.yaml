profile:
  id: local-rtx4080-super-16gb
  gpu_count: 1
  allocation: single-gpu-non-exclusive-host
  notes:
    - Compose selects one GPU but cannot exclude WDDM or other host consumers.
    - Keep Windows desktop GPU consumers quiet during every comparison.
    - The 0.75 memory fraction leaves headroom for WDDM and display workloads.

scenarios:
  - name: baseline
    engine_args:
      enable_prefix_caching: false
      max_model_len: 4096
      max_num_batched_tokens: 4096
      gpu_memory_utilization: 0.75
  - name: prefix-cache
    engine_args:
      enable_prefix_caching: true
      max_model_len: 4096
      max_num_batched_tokens: 4096
      gpu_memory_utilization: 0.75
  - name: constrained-batch
    engine_args:
      enable_prefix_caching: false
      max_model_len: 4096
      max_num_batched_tokens: 128
      gpu_memory_utilization: 0.75

concurrency: [1, 2, 4, 8, 16]
requests_per_level: 20
warmup_requests: 5
max_tokens: 128
runs_per_scenario: 3
