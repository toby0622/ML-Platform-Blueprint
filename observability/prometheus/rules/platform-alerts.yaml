groups:
  - name: ml-platform-slo
    interval: 30s
    rules:
      - record: ml_platform:prediction_error_ratio_5m
        expr: |
          (sum(rate(ml_platform_predictions_total{outcome="error"}[5m])) or vector(0))
          /
          clamp_min(sum(rate(ml_platform_predictions_total[5m])), 0.001)

      - record: ml_platform:prediction_error_ratio_30m
        expr: |
          (sum(rate(ml_platform_predictions_total{outcome="error"}[30m])) or vector(0))
          /
          clamp_min(sum(rate(ml_platform_predictions_total[30m])), 0.001)

      - record: ml_platform:prediction_error_ratio_1h
        expr: |
          (sum(rate(ml_platform_predictions_total{outcome="error"}[1h])) or vector(0))
          /
          clamp_min(sum(rate(ml_platform_predictions_total[1h])), 0.001)

      - record: ml_platform:prediction_error_ratio_6h
        expr: |
          (sum(rate(ml_platform_predictions_total{outcome="error"}[6h])) or vector(0))
          /
          clamp_min(sum(rate(ml_platform_predictions_total[6h])), 0.001)

      - alert: MLPlatformControlPlaneDown
        expr: up{job="platform-api"} == 0
        for: 2m
        labels:
          severity: critical
          owner: ml-platform
        annotations:
          summary: ML platform control plane is unavailable
          runbook_url: runbooks/control-plane-unavailable.md

      - alert: MLPlatformPredictionErrorBudgetFastBurn
        expr: |
          ml_platform:prediction_error_ratio_5m > 0.072
          and
          ml_platform:prediction_error_ratio_1h > 0.072
        for: 5m
        labels:
          severity: critical
          owner: ml-platform
        annotations:
          summary: Prediction errors are burning the 99.5% availability budget at 14.4x
          runbook_url: runbooks/model-rollout-and-rollback.md

      - alert: MLPlatformPredictionErrorBudgetSlowBurn
        expr: |
          ml_platform:prediction_error_ratio_30m > 0.03
          and
          ml_platform:prediction_error_ratio_6h > 0.03
        for: 30m
        labels:
          severity: warning
          owner: ml-platform
        annotations:
          summary: Prediction errors are burning the 99.5% availability budget at 6x
          runbook_url: runbooks/model-rollout-and-rollback.md

      - alert: MLPlatformNoSuccessfulTraining
        expr: |
          increase(ml_platform_training_runs_total{status="failed"}[1h]) >= 3
          and
          increase(ml_platform_training_runs_total{status="succeeded"}[1h]) == 0
        for: 5m
        labels:
          severity: warning
          owner: ml-platform
        annotations:
          summary: All recent model training runs have failed
          runbook_url: runbooks/registry-or-object-store-outage.md

  - name: kubernetes-ai-workloads
    interval: 30s
    rules:
      - alert: KueueWorkloadQueueStalled
        expr: sum(kueue_pending_workloads) by (cluster_queue) > 0
        for: 15m
        labels:
          severity: warning
          owner: ml-platform
        annotations:
          summary: Workloads have waited in Kueue for more than 15 minutes
          runbook_url: runbooks/queue-starvation.md

      - alert: NvidiaGpuXidError
        expr: increase(DCGM_FI_DEV_XID_ERRORS[5m]) > 0
        labels:
          severity: critical
          owner: ml-platform
        annotations:
          summary: NVIDIA GPU reported an XID error
          runbook_url: runbooks/gpu-capacity-unavailable.md

      - alert: NvidiaGpuLowUtilization
        expr: avg_over_time(DCGM_FI_DEV_GPU_UTIL[30m]) < 10
        for: 30m
        labels:
          severity: info
          owner: ml-platform
        annotations:
          summary: Allocated GPU utilization has remained below 10%
          runbook_url: runbooks/gpu-capacity-unavailable.md
