global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: compose
    platform: ml-platform-blueprint

rule_files:
  - /etc/prometheus/rules/*.yaml

scrape_configs:
  - job_name: platform-api
    metrics_path: /metrics
    static_configs:
      - targets: [platform-api:8080]
        labels:
          service: ml-platform-control-plane

  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
