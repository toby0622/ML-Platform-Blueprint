apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: churn-classifier
  namespace: team-a
  annotations:
    serving.kserve.io/deploymentMode: Standard
spec:
  predictor:
    minReplicas: 1
    maxReplicas: 3
    scaleMetric: concurrency
    scaleTarget: 5
    timeout: 30
    serviceAccountName: model-serving
    storageUris:
      - uri: s3://REPLACE_WITH_ARTIFACT_BUCKET/tenants/team-a/models/churn-classifier/1
        mountPath: /mnt/models
    containers:
      - name: kserve-container
        image: ghcr.io/toby0622/ml-platform-blueprint:0.1.0
        command: [ml-model-server]
        args:
          - --artifact
          - /mnt/models/model.json
          - --model-name
          - churn-classifier
          - --model-version
          - "1"
        env:
          - name: PROTOCOL
            value: V2
        ports:
          - name: http1
            containerPort: 8080
            protocol: TCP
        readinessProbe:
          httpGet:
            path: /v2/health/ready
            port: 8080
          initialDelaySeconds: 2
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /v2/health/live
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 15
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: "2"
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities:
            drop: [ALL]
