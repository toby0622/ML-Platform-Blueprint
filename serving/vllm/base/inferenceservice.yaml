apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: qwen-llm
  namespace: team-a
  annotations:
    serving.kserve.io/deploymentMode: Standard
spec:
  predictor:
    minReplicas: 1
    maxReplicas: 2
    serviceAccountName: model-serving
    model:
      modelFormat:
        name: huggingface
      args:
        - --model_name=qwen
        - --enable_prefix_caching
        - --max_model_len=4096
        - --gpu_memory_utilization=0.90
      storageUri: hf://Qwen/Qwen2.5-0.5B-Instruct
      resources:
        requests:
          cpu: "1"
          memory: 4Gi
          nvidia.com/gpu: "1"
        limits:
          cpu: "2"
          memory: 8Gi
          nvidia.com/gpu: "1"
    nodeSelector:
      ml-platform.io/accelerator: nvidia-a10
    tolerations:
      - key: nvidia.com/gpu
        operator: Equal
        value: present
        effect: NoSchedule
